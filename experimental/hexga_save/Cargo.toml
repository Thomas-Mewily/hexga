[package]
name = "hexga_save"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
readme = "README.md"

description = "Io file traits abstraction based to allow load/save value into a file while also managing the encoding, and iterating over directory."
categories = ["filesystem", "encoding"]

[features]
default = ["serde", "serde_rc", "hexga_encoding_derive"]

serde = ["dep:serde", "hexga_io/serde", "hexga_encoding/serde"]
serde_rc = ["serde/rc",  "hexga_io/serde_rc", "hexga_encoding/serde_rc"]

hexga_encoding_derive = ["hexga_encoding/derive"]

[dependencies]
serde = { version = "1.0.0", optional = true }
hexga_io.workspace = true
hexga_encoding.workspace = true
