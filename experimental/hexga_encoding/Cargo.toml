[package]
name = "hexga_encoding"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
readme = "README.md"

description = "Encoding and I/O abstraction for loading, saving, and converting data with custom extensions and media types, with optional Serde integration."
keywords = ["encoding", "serde", "data-url", "load", "save"]
categories = ["encoding", "filesystem", "data-structures", "compression"]

[features]
default = ["serde", "serde_rc", "derive"]

serde = ["dep:serde",
    "dep:ron",
    "dep:serde_json",
    "dep:serde-xml-rs",
    "dep:bincode",
    
    "hexga_core/serde",
    "hexga_io/serde",
]

serde_rc = ["serde/rc", "hexga_io/serde_rc"]
derive = ["dep:hexga_encoding_derive"]

print_io = ["hexga_io/print_io"]

[dependencies]
hexga_core = { workspace = true, features = ["std"] }
hexga_utils.workspace = true
hexga_io.workspace = true

serde = { version = "1.0.0", optional = true }
hexga_encoding_derive = { workspace = true, optional = true }


base64 = "0.22.1"

ron = { version = "0.12.1", optional = true }
serde_json = { version = "1.0.150", optional = true }
serde-xml-rs = { version = "0.8.2", optional = true }
bincode = { version = "1.3.3", optional = true }
