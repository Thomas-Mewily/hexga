[package]
name = "hexga_io"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
readme = "README.md"

description = "io file traits abstraction based to allow loading/saving from a file, and iterating over directory"
categories = ["filesystem", "encoding"]

[features]
default = ["serde", "serde_rc"]

serde = ["dep:serde", "hexga_core/serde", "hexga_encoding/serde"]
serde_rc = ["serde/rc",  "hexga_core/serde_rc", "hexga_encoding/serde_rc"]



[dependencies]
serde = { version = "1.0.0", optional = true }
hexga_core.workspace = true
hexga_encoding.workspace = true
