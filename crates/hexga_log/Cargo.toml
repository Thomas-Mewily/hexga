[package]
name = "hexga_log"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
readme = "README.md"
description = "Lazy configurable logging for the Hexga ecosystem"
keywords = ["logging", "logger", "diagnostics", "filtering"]
categories = ["development-tools::debugging"]

[features]
default = ["log_env"]
std = ["log/std"]
log_env = ["std", "dep:env_logger", "dep:web-sys"]
serde = ["dep:serde"]

[dependencies]
hexga_core_utils.workspace = true
log = { version = "0.4.22", default-features = false }
serde = { version = "1.0.0", features = ["derive"], optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
env_logger = { version = "0.10", optional = true, default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys = { version = "0.3", features = ["console"], optional = true }

[[example]]
name = "scoped_logging"
required-features = ["std"]
