[package]
name = "hexga_core"
version.workspace = true
authors.workspace = true
license.workspace = true
#homepage.workspace = true
repository.workspace = true
edition.workspace = true
readme = "README.md"

keywords = []
description = "Basic set of functionalities common to all hexga crate"
categories = ["rust-patterns"]

[features]
default = ["std", "log_env", "serde", "serde_rc"]

std = ["hexga_guard/std", "hexga_log/std"]
log_env = ["std", "hexga_log/log_env"]
feature_mapped_lock_guards = ["hexga_guard/feature_mapped_lock_guards"]

serde = ["dep:serde", "hexga_log/serde"]
serde_rc = ["serde/rc"]


[dependencies]
hexga_core_utils.workspace = true
hexga_guard.workspace = true
hexga_log.workspace = true
hexga_map_on.workspace = true
hexga_bit = { workspace = true, features = ["derive"] }
serde = { version = "1.0.0", features = ["derive"], optional = true }

[[example]]
name = "collection_guards"
required-features = ["std"]
